<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geoffjay - personal sites</title>
    <script defer type="module" src="app.js"></script>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/geoffjay.png" />
  </head>
  <body hx-ext="templates">
    <div class="bg-slate-200 dark:bg-slate-600">
      <div class="flex justify-center items-center h-screen">
        <button
          class="relative flex h-[120px] w-[120px]"
          hx-get="/data/apps.json"
          hx-target="#menu"
          hx-swap="outerHTML"
          hx-ext="json-enc"
          handlebars-template="menu-template"
          type="submit"
        >
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-300 dark:bg-slate-700 opacity-50"
          ></span>
          <img
            src="/geoffjay.png"
            alt="geoffjay"
            class="w-[120px] h-[120px] filter drop-shadow-lg"
          />
        </button>

        <div id="menu" class="hidden"></div>
      </div>
    </div>

    <template id="menu-template">
      <ul class="menu" style="--m: 3">
        {{#each apps}}
        <li
          class="absolute bg-slate-200 dark:bg-slate-600"
          style="--i: {{@index}}"
        >
          <img
            src="/geoffjay.png"
            alt="{{name}}: {{@index}}"
            class="w-[120px] h-[120px] filter drop-shadow-lg"
          />
        </li>
        {{/each}}
      </ul>
    </template>
  </body>
</html>
