<!doctype html>
<html lang="en" id="root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geoffjay - personal sites</title>
    <script defer type="module" src="app.js"></script>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/geoffjay.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://unpkg.com/hyperscript.org@0.9.13"></script>
    <script>
      // Apply theme immediately to prevent flash
      (function () {
        var theme = localStorage.getItem("theme");
        var isDark =
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
        }
        // Set icon visibility after DOM is ready
        document.addEventListener("DOMContentLoaded", function () {
          var sunIcon = document.getElementById("icon-sun");
          var moonIcon = document.getElementById("icon-moon");
          if (sunIcon && moonIcon) {
            if (isDark) {
              moonIcon.classList.remove("hidden");
              sunIcon.classList.add("hidden");
            } else {
              sunIcon.classList.remove("hidden");
              moonIcon.classList.add("hidden");
            }
          }
        });
      })();
    </script>
  </head>
  <body
    hx-ext="preload"
    _="on click
        if #menu does not match .hidden
          if not event.target.closest('#menu') and not event.target.closest('.menu-button')
            remove .menu-open from #menu-list
            add .menu-closing to #menu-list
            wait 0.5s
            add .hidden to #menu
          end
        end
      on keydown[key is 'Escape'] from window
        if #menu does not match .hidden
          remove .menu-open from #menu-list
          add .menu-closing to #menu-list
          wait 0.5s
          add .hidden to #menu
        end"
  >
    <div class="flex flex-col h-screen bg-slate-200 dark:bg-slate-600">
      <div class="flex justify-center items-center h-screen">
        <button
          class="menu-button relative flex h-[120px] w-[120px]"
          type="button"
          _="on click
              add .pulse to me
              wait 0.3s
              remove .pulse from me
            then
              if #menu matches .hidden
                remove .hidden from #menu
                remove .menu-closing from #menu-list
                add .menu-open to #menu-list
              else
                remove .menu-open from #menu-list
                add .menu-closing to #menu-list
                wait 0.5s
                add .hidden to #menu
              end"
        >
          <span
            class="absolute inline-flex h-full w-full rounded-full bg-slate-300 dark:bg-slate-700 opacity-50"
          ></span>
          <span class="menu-button-overlay"></span>
          <img
            src="/geoffjay.png"
            alt="geoffjay"
            class="menu-button-image w-[120px] h-[120px] filter drop-shadow-lg z-10"
          />
        </button>

        <div id="menu" class="absolute hidden">
          <ul id="menu-list" class="menu" style="--m: 4">
            <li class="absolute bg-slate-200 dark:bg-slate-600" style="--i: 0">
              <a
                href="https://app.geoffjay.com"
                target="_blank"
                class="menu-item"
                _="on click
                    add .pulse to me
                    remove .menu-open from #menu-list
                    add .menu-closing to #menu-list
                    wait 0.3s
                    remove .pulse from me
                    wait 0.2s
                    add .hidden to #menu"
              >
                <span class="menu-item-overlay"></span>
                <img
                  src="/images/mandala-1.png"
                  alt="app"
                  class="menu-item-image w-[120px] h-[120px] filter drop-shadow-lg"
                />
                <span class="text-slate-500 dark:text-slate-400 text-sm mt-4"
                  >personal app</span
                >
              </a>
            </li>
            <li class="absolute bg-slate-200 dark:bg-slate-600" style="--i: 1">
              <a
                href="/about"
                class="menu-item"
                _="on click
                    add .pulse to me
                    remove .menu-open from #menu-list
                    add .menu-closing to #menu-list
                    wait 0.3s
                    remove .pulse from me
                    wait 0.2s
                    add .hidden to #menu"
              >
                <span class="menu-item-overlay"></span>
                <img
                  src="/images/mandala-2.png"
                  alt="about"
                  class="menu-item-image w-[120px] h-[120px] filter drop-shadow-lg"
                />
                <span class="text-slate-500 dark:text-slate-400 text-sm mt-4"
                  >about</span
                >
              </a>
            </li>
            <li class="absolute bg-slate-200 dark:bg-slate-600" style="--i: 2">
              <a
                href="https://blog.geoffjay.com"
                target="_blank"
                class="menu-item"
                _="on click
                    add .pulse to me
                    remove .menu-open from #menu-list
                    add .menu-closing to #menu-list
                    wait 0.3s
                    remove .pulse from me
                    wait 0.2s
                    add .hidden to #menu"
              >
                <span class="menu-item-overlay"></span>
                <img
                  src="/images/mandala-3.png"
                  alt="blog"
                  class="menu-item-image w-[120px] h-[120px] filter drop-shadow-lg"
                />
                <span class="text-slate-500 dark:text-slate-400 text-sm mt-4"
                  >blog</span
                >
              </a>
            </li>
            <li class="absolute bg-slate-200 dark:bg-slate-600" style="--i: 3">
              <a
                href="/projects"
                class="menu-item"
                _="on click
                    add .pulse to me
                    remove .menu-open from #menu-list
                    add .menu-closing to #menu-list
                    wait 0.3s
                    remove .pulse from me
                    wait 0.2s
                    add .hidden to #menu"
              >
                <span class="menu-item-overlay"></span>
                <img
                  src="/images/mandala-4.png"
                  alt="projects"
                  class="menu-item-image w-[120px] h-[120px] filter drop-shadow-lg"
                />
                <span class="text-slate-500 dark:text-slate-400 text-sm mt-4"
                  >projects</span
                >
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div
        class="h-10 w-full flex gap-4 my-auto justify-center align-middle bg-slate-300 dark:bg-slate-700 border-t-2 border-t-slate-400 dark:border-t-slate-500 text-sm text-slate-400 dark:text-slate-500"
      >
        <a
          class="flex gap-2 my-auto hover:text-slate-600 hover:dark:text-slate-400"
          href="https://github.com/geoffjay"
          target="_blank"
        >
          <i class="fa-brands fa-github fa-lg my-auto"></i>
          <p>Github</p>
        </a>
        <a
          class="flex gap-2 my-auto hover:text-slate-600 hover:dark:text-slate-400"
          href="https://linkedin.com/in/geoffjay"
          target="_blank"
        >
          <i class="fa-brands fa-linkedin fa-lg my-auto"></i>
          <p>Linkedin</p>
        </a>
        <a
          class="flex gap-2 my-auto hover:text-slate-600 hover:dark:text-slate-400"
          href="mailto:geoff.jay@gmail.com"
          target="_blank"
        >
          <i class="fa-brands fa-at fa-lg my-auto"></i>
          <p>geoff.jay@gmail.com</p>
        </a>
        <button
          id="theme-toggle"
          class="flex gap-2 my-auto hover:text-slate-600 hover:dark:text-slate-400 cursor-pointer"
          type="button"
          _="on click
              if #root matches .dark
                remove .dark from #root
                call localStorage.setItem('theme', 'light')
                add .hidden to #icon-moon
                remove .hidden from #icon-sun
              else
                add .dark to #root
                call localStorage.setItem('theme', 'dark')
                add .hidden to #icon-sun
                remove .hidden from #icon-moon
              end"
        >
          <i id="icon-sun" class="fa-solid fa-sun fa-lg my-auto hidden"></i>
          <i id="icon-moon" class="fa-solid fa-moon fa-lg my-auto hidden"></i>
        </button>
      </div>
    </div>
  </body>
</html>
