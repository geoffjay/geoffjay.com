<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geoffjay - personal sites</title>
    <script defer type="module" src="app.js"></script>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/geoffjay.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body hx-ext="templates" hx-ext="preload">
    <div class="flex flex-col h-screen bg-slate-200 dark:bg-slate-600">
      <div class="flex justify-center items-center h-screen">
        <button
          class="relative flex h-[120px] w-[120px]"
          hx-get="/data/apps.json"
          hx-target="#menu"
          hx-swap="outerHTML"
          hx-ext="json-enc"
          type="submit"
          handlebars-template="menu-template"
          preload
        >
          <span
            class="absolute inline-flex h-full w-full rounded-full bg-slate-300 dark:bg-slate-700 opacity-50"
          ></span>
          <img
            src="/geoffjay.png"
            alt="geoffjay"
            class="w-[120px] h-[120px] filter drop-shadow-lg z-10"
          />
        </button>

        <div id="menu" class="hidden"></div>
      </div>
      <div
        class="h-10 w-full flex gap-4 my-auto justify-center align-middle bg-slate-300 dark:bg-slate-700 border-t-2 border-t-slate-500 dark:border-t-slate-500 text-sm text-slate-400 dark:text-slate-500"
      >
        <a
          class="flex gap-2 my-auto hover:text-slate-300 hover:dark:text-slate-400"
          href="https://github.com/geoffjay"
          target="_blank"
        >
          <i class="fa-brands fa-github fa-lg my-auto"></i>
          <p>Github</p>
        </a>
        <a
          class="flex gap-2 my-auto hover:text-slate-300 hover:dark:text-slate-400"
          href="https://linkedin.com/in/geoffjay"
          target="_blank"
        >
          <i class="fa-brands fa-linkedin fa-lg my-auto"></i>
          <p>Linkedin</p>
        </a>
        <a
          class="flex gap-2 my-auto hover:text-slate-300 hover:dark:text-slate-400"
          href="mailto:geoff.jay@gmail.com"
          target="_blank"
        >
          <i class="fa-brands fa-at fa-lg my-auto"></i>
          <p>geoff.jay@gmail.com</p>
        </a>
      </div>
    </div>

    <template id="menu-template">
      <ul class="menu" style="--m: 4">
        {{#each apps}}
        <li
          class="absolute bg-slate-200 dark:bg-slate-600"
          style="--i: {{@index}}"
        >
          <a href="{{location}}">
            <img
              src="{{icon}}"
              alt="{{name}}"
              class="w-[120px] h-[120px] filter drop-shadow-lg"
            />
          </a>
        </li>
        {{/each}}
      </ul>
    </template>
  </body>
</html>
