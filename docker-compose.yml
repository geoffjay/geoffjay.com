services:
  nginx:
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - pocketbase
    ports:
      - "9080:8080"
    volumes:
      - ./proxy/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./client/dist:/usr/share/nginx/html
    extra_hosts:
      - geoffjay.local:127.0.0.1
      - api.geoffjay.local:127.0.0.1
      - app.geoffjay.local:127.0.0.1
    profiles:
      - core

  pocketbase:
    container_name: pocketbase
    build:
      context: ./pocketbase
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./pocketbase/data:/pb/pb_data
    profiles:
      - core

  api:
    container_name: api
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./api:/api
    profiles:
      - services

  app:
    container_name: app
    build:
      context: ./app
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8083:5173"
    volumes:
      - ./app:/app
    profiles:
      - applications

  photo:
    container_name: photo
    build:
      context: ./photo
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8084:5173"
    volumes:
      - ./photo:/photo
    profiles:
      - applications
