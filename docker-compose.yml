services:
  nginx:
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - pocketbase
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./client/dist:/usr/share/nginx/html
    extra_hosts:
      - host.docker.internal:host-gateway

  pocketbase:
    container_name: pocketbase
    build:
      context: ./pocketbase
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./pocketbase/data:/pb/pb_data
