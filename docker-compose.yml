services:
  nginx:
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - pocketbase
    ports:
      - "9080:8080"
    volumes:
      - ./proxy/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./client/dist:/usr/share/nginx/html
    extra_hosts:
      - geoffjay.local:127.0.0.1
      - api.geoffjay.local:127.0.0.1
      - app.geoffjay.local:127.0.0.1
    profiles:
      - core
    networks:
      - geoffjay-com

  api:
    container_name: api
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./api:/api
    profiles:
      - services
    networks:
      - geoffjay-com

  app:
    container_name: app
    build:
      context: ./app
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8083:5173"
    volumes:
      - ./app:/app
    profiles:
      - applications
    networks:
      - geoffjay-com

  photo:
    container_name: photo
    build:
      context: ./photo
      dockerfile: dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8084:5173"
    volumes:
      - ./photo:/photo
    profiles:
      - applications
    networks:
      - geoffjay-com

networks:
  geoffjay-com:
    external: true
