[package]
name = "blog-geoffjay-com"
repository = "https://github.com/geoffjay/geoffjay.com"
version = "0.1.0"
edition = "2021"

[dependencies]
gloo = "0.11"
gloo-storage = "0.3"
js-sys = "0.3"
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
serde = "1.0"
time = { version = "0.3.30", features = ["macros", "formatting"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
yew = { version = "0.21.0", features = ["csr"] }
yew-hooks = "0.3"
yew-router = "0.18"
yew_icons = { version = "0.8", features = [
  "OcticonsSun16",
  "OcticonsMoon16",
  "OcticonsTerminal16",
] }
yewdux = "0.10"

[dependencies.web-sys]
version = "0.3"
features = [
  "DomTokenList",
  "Element",
  "Headers",
  "MediaQueryList",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "Window",
]

[patch."crates-io"]
# yew = { path = "../yew/packages/yew" }
# yew-router = { path = "../yew/packages/yew-router" }
yew = { git = "https://github.com/geoffjay/yew", branch = "mdx" }
yew-router = { git = "https://github.com/geoffjay/yew", branch = "mdx" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = true
